<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфоліо Арсена</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&family=Raleway:wght@400;700;900&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Задаємо основні кольори сайту */
        :root {
            --main-c: #ffffff;
            --accent-c: #333333;
            --highlight-c: #f06060;
        }
        /* Скидаємо стандартні відступи */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Плавне прокручування до секцій */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 25px;
        }
        /* Основні стилі сторінки */
        body {
            color: var(--main-c);
            background: var(--accent-c);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        /* Стилі посилань */
        a {
            color: inherit;
            text-decoration: none;
        }
        /* Стилі першого екрана */
        header {
            height: 100vh;
            min-height: 450px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-c);
        }
        /* Великий заголовок */
        .titanic {
            font-family: 'Raleway', sans-serif;
            font-size: clamp(60px, 12vw, 144px);
            font-weight: 900;
            text-align: center;
            padding: 20px;
        }
        /* Кнопки відкриття та закриття меню */
        .nav-toggle {
            position: fixed;
            top: 25px;
            left: 25px;
            font-size: 36px;
            color: var(--highlight-c);
            cursor: pointer;
            z-index: 1001;
            background: transparent;
            border: none;
        }
        /* Кнопка закриття меню */
        .close-menu {
            left: auto;
            right: 25px;
        }
        /* Затемнене меню на весь екран */
        nav {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #252525;
            visibility: hidden;
            opacity: 0;
            transform: translateX(-100%);
            transition: transform 0.45s ease, opacity 0.35s ease, visibility 0.45s;
        }
        /* Відкрите меню */
        nav.open {
            visibility: visible;
            opacity: 1;
            transform: translateX(0);
        }
        /* Прибираємо маркери списку */
        #nav {
            list-style: none;
            width: 100%;
            text-align: center;
        }
        /* Відступи між пунктами меню */
        #nav li {
            margin: 15px 0;
        }
        /* Стилі посилань меню */
        .nav-link {
            display: inline-block;
            font-family: 'Inconsolata', monospace;
            font-size: clamp(28px, 5vw, 46px);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 15px;
        }
        /* Лінія під пунктом меню */
        .underline {
            width: 0;
            height: 2px;
            margin: 0 auto;
            background: var(--main-c);
            transition: width 0.3s ease;
        }
        /* Анімація лінії при наведенні */
        #nav li:hover .underline,
        #nav li:focus-within .underline {
            width: 100px;
        }
        /* Кнопка повернення нагору */
        #arrow {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 900;
            color: var(--highlight-c);
            font-size: 38px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: 0.3s ease;
        }
        /* Показуємо кнопку після прокручування */
        #arrow.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        /* Загальні стилі секцій */
        section {
            padding: 60px 5%;
        }
        /* Секція про автора */
        main {
            min-height: 60vh;
            padding: 70px 8%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--main-c);
        }
        /* Текст про автора */
        #intro {
            color: var(--accent-c);
            font-size: clamp(28px, 6vw, 75px);
            font-weight: 200;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        /* Заголовки секцій */
        h2 {
            margin: 30px auto 60px;
            padding: 10px 0;
            color: var(--accent-c);
            text-align: center;
            font-size: clamp(36px, 8vw, 90px);
            font-weight: 900;
            border-top: 4px solid var(--accent-c);
            border-bottom: 4px solid var(--accent-c);
        }
        /* Секція навичок */
        .skills-sec {
            background: var(--main-c);
            color: var(--accent-c);
        }
        /* Сітка навичок */
        #skills {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }
        /* Картки навичок */
        .skill {
            width: 100%;
            height: 180px;
            padding: 20px;
            object-fit: contain;
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        /* Показуємо навички */
        .skill.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Секція портфоліо */
        .portfolio-sec {
            background: var(--accent-c);
        }
        /* Заголовок портфоліо */
        .portfolio-sec h2 {
            color: var(--main-c);
            border-color: var(--main-c);
        }
        /* Сітка проєктів */
        #portfolio {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        /* Картка проєкту */
        .project {
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        /* Показуємо проєкти */
        .project.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Зображення проєктів */
        .project img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        /* Ефект при наведенні на проєкт */
        .project a:hover img {
            transform: scale(1.05);
            opacity: 0.8;
        }
        /* Підвал сторінки */
        footer {
            padding: 50px 5%;
            background: var(--main-c);
            color: var(--accent-c);
        }
        /* Заголовок контактів */
        footer h2 {
            margin-top: 20px;
        }
        /* Сітка контактів */
        #contacts {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 15px;
        }
        /* Кнопки контактів */
        .contact-link {
            display: block;
            padding: 15px 8px;
            border: 2px solid var(--accent-c);
            color: var(--accent-c);
            text-align: center;
            text-transform: uppercase;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease, color 0.3s ease;
            background: linear-gradient(45deg, var(--accent-c) 50%, transparent 50%);
            background-size: 300% 100%;
            background-position: 100% 0;
        }
        /* Анімація кнопок контактів */
        .contact-link:hover,
        .contact-link:focus-visible {
            background-position: 0 0;
            color: var(--main-c);
        }
        /* Невеликий підпис у підвалі */
        .copyright {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #666666;
        }
        /* Адаптація для планшетів */
        @media (max-width: 768px) {
            #skills,
            #portfolio {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            #contacts {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .skill {
                height: 150px;
            }
            section {
                padding: 45px 5%;
            }
        }
        /* Адаптація для телефонів */
        @media (max-width: 480px) {
            #skills,
            #portfolio,
            #contacts {
                grid-template-columns: 1fr;
            }
            .skill {
                height: 180px;
            }
            main {
                padding: 50px 6%;
            }
            .nav-toggle {
                top: 15px;
                left: 15px;
                font-size: 30px;
            }
            .close-menu {
                left: auto;
                right: 15px;
            }
            #arrow {
                bottom: 15px;
                left: 15px;
            }
        }
        /* Вимикаємо зайві анімації, якщо користувач це налаштував */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Кнопка повернення нагору -->
    <button id="arrow" type="button" aria-label="Повернутися нагору">
        <i class="fa fa-arrow-circle-up" aria-hidden="true"></i>
    </button>
    <!-- Кнопка відкриття меню -->
    <button class="nav-toggle" id="open-menu" type="button" aria-label="Відкрити меню" aria-controls="navigation" aria-expanded="false">
        <i class="fa fa-bars" aria-hidden="true"></i>
    </button>
    <!-- Навігаційне меню -->
    <nav id="navigation" aria-label="Головна навігація">
        <button class="nav-toggle close-menu" id="close-menu" type="button" aria-label="Закрити меню">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
        <ul id="nav">
            <li><a class="nav-link" href="#intro">About</a><div class="underline"></div></li>
            <li><a class="nav-link" href="#skills">Skills</a><div class="underline"></div></li>
            <li><a class="nav-link" href="#portfolio">Portfolio</a><div class="underline"></div></li>
            <li><a class="nav-link" href="#contacts">Contacts</a><div class="underline"></div></li>
        </ul>
    </nav>
    <!-- Головний екран -->
    <header id="home">
        <h1 class="titanic">Привіт!</h1>
    </header>
    <!-- Інформація про автора -->
    <main>
        <div id="intro">Я Арсен. Хочу поділитися своїми навичками й зацікавити вас своїми вміннями.</div>
    </main>
    <!-- Секція навичок -->
    <section class="skills-sec" id="skills-section">
        <h2>Skills</h2>
        <div id="skills">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS3">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML5">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/bootstrap/bootstrap-original.svg" alt="Bootstrap">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jquery/jquery-original.svg" alt="jQuery">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" alt="Git">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/sass/sass-original.svg" alt="Sass">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/gulp/gulp-plain.svg" alt="Gulp">
            <img class="skill" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React">
        </div>
    </section>
    <!-- Секція портфоліо -->
    <section class="portfolio-sec">
        <h2>Portfolio</h2>
        <div id="portfolio">
            <div class="project"><a href="https://codepen.io/dagman/pen/BKddGL" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Weather+App" alt="Weather App"></a></div>
            <div class="project"><a href="https://codepen.io/dagman/pen/oxqzLx" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Pomodoro+Timer" alt="Pomodoro Timer"></a></div>
            <div class="project"><a href="https://codepen.io/dagman/pen/NNXdxw" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Calculator" alt="Calculator"></a></div>
            <div class="project"><a href="https://codepen.io/dagman/pen/oxdYgW" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Simon+Game" alt="Simon Game"></a></div>
            <div class="project"><a href="https://codepen.io/dagman/pen/yOzemP" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Quote+Machine" alt="Quote Machine"></a></div>
            <div class="project"><a href="https://codepen.io/dagman/pen/jqZbje" target="_blank" rel="noopener noreferrer"><img src="https://placehold.co/600x450/333333/ffffff?text=Tic+Tac+Toe" alt="Tic Tac Toe"></a></div>
        </div>
    </section>
    <!-- Контакти -->
    <footer>
        <h2>Get in Touch</h2>
        <div id="contacts">
            <a class="contact-link" href="mailto:arsen@example.com"><i class="fa fa-envelope" aria-hidden="true"></i> Mail</a>
            <a class="contact-link" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"><i class="fa fa-linkedin" aria-hidden="true"></i> LinkedIn</a>
            <a class="contact-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer"><i class="fa fa-facebook" aria-hidden="true"></i> Facebook</a>
            <a class="contact-link" href="https://www.freecodecamp.org/" target="_blank" rel="noopener noreferrer"><i class="fa fa-free-code-camp" aria-hidden="true"></i> freeCodeCamp</a>
        </div>
        <p class="copyright">© 2026 Arsen. Усі права захищені.</p>
    </footer>
    <script>
        // Знаходимо елементи меню
        const navigation = document.getElementById('navigation');
        const openMenuButton = document.getElementById('open-menu');
        const closeMenuButton = document.getElementById('close-menu');
        const navLinks = document.querySelectorAll('.nav-link');
        // Відкриваємо меню
        function openMenu() {
            navigation.classList.add('open');
            openMenuButton.setAttribute('aria-expanded', 'true');
            closeMenuButton.focus();
        }
        // Закриваємо меню
        function closeMenu() {
            navigation.classList.remove('open');
            openMenuButton.setAttribute('aria-expanded', 'false');
            openMenuButton.focus();
        }
        // Обробляємо натискання кнопки відкриття
        openMenuButton.addEventListener('click', openMenu);
        // Обробляємо натискання кнопки закриття
        closeMenuButton.addEventListener('click', closeMenu);
        // Закриваємо меню після вибору розділу
        navLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                navigation.classList.remove('open');
                openMenuButton.setAttribute('aria-expanded', 'false');
            });
        });
        // Закриваємо меню клавішею Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && navigation.classList.contains('open')) {
                closeMenu();
            }
        });
        // Знаходимо кнопку повернення нагору
        const arrowButton = document.getElementById('arrow');
        // Показуємо або приховуємо кнопку під час прокручування
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                arrowButton.classList.add('visible');
            } else {
                arrowButton.classList.remove('visible');
            }
        });
        // Повертаємося на початок сторінки
        arrowButton.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        // Знаходимо всі елементи, які потрібно анімувати
        const animatedElements = document.querySelectorAll('.skill, .project');
        // Перевіряємо, чи підтримує браузер IntersectionObserver
        if ('IntersectionObserver' in window) {
            // Створюємо спостерігач за появою елементів на екрані
            const observer = new IntersectionObserver(function(entries, observerInstance) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        observerInstance.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.15
            });
            // Починаємо спостерігати за кожним елементом
            animatedElements.forEach(function(element) {
                observer.observe(element);
            });
        } else {
            // Показуємо елементи в старих браузерах без IntersectionObserver
            animatedElements.forEach(function(element) {
                element.classList.add('show');
            });
        }
    </script>
</body>
</html>
